name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y opam libsqlite3-dev

      # The 5.2.0+ox compiler is the ocaml-variants.5.2.0+ox package, which lives ONLY in
      # the OxCaml opam-repository. setup-ocaml's ocaml-compiler input resolves to stock
      # ocaml-base-compiler.5.2.0, which cannot parse OxCaml syntax (@@ portable, modes,
      # value_or_null), so the switch must be created the way OxCaml documents instead.
      - name: Init opam and create the OxCaml switch
        run: |
          opam init --bare --disable-sandboxing --no-setup
          opam switch create 5.2.0+ox \
            --repos ox=git+https://github.com/oxcaml/opam-repository.git,default

      # Install from the committed lockfile: exact pinned versions for the whole transitive
      # closure, so opam skips dependency resolution entirely (the 60s solver timeout that
      # the unlocked install hit). Versions match the local working switch.
      - name: Install dependencies
        run: opam install . --deps-only --locked --with-test

      - name: Build
        run: opam exec -- dune build @all

      - name: Test
        run: opam exec -- dune runtest
